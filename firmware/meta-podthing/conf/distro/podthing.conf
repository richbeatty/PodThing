require conf/distro/superbird.conf

DISTRO = "podthing"
DISTRO_NAME = "PodThing"
DISTRO_VERSION = "0.1.0"
MAINTAINER = "PodThing contributors"

SUPERBIRD_HOSTNAME = "podthing"
SUPERBIRD_MDNS_SERVICE_NAME = "PodThing"
SUPERBIRD_USB_GADGET_NAME = "PodThing"
SUPERBIRD_USB_GADGET_MANUFACTURER = "PodThing"
SUPERBIRD_USB_GADGET_PRODUCT = "PodThing Recovery"
SUPERBIRD_DESCRIPTION = "Spotify Car Thing running PodThing"

# Native wl_shm UI; no Chromium, phone projection or Prelude daemon.
PACKAGECONFIG:remove:pn-weston = "vnc headless xwayland rdp pipewire remoting"
DISTRO_FEATURES:remove = "x11 pulseaudio"
