# Debian systemd/udev and ext4 root without initramfs.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_UTF8=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y
CONFIG_CONFIGFS_FS=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_ROLE_SWITCH=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_BPF=y
CONFIG_FHANDLE=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_VT=y
CONFIG_UNIX=y
CONFIG_IP_PNP=y
# Reduce runtime memory and prevent unnecessary automatic driver binding.
# CONFIG_DEBUG_INFO is not set
# CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT is not set
CONFIG_DEBUG_INFO_NONE=y
# CONFIG_LOCALVERSION_AUTO is not set
CONFIG_LOCALVERSION="-podthing"
CONFIG_STRICT_DEVMEM=y

# Small virtio transport also permits booting this exact kernel in QEMU.
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
